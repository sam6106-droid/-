<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1인칭 오토바이 회피 게임</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #030308;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        #handlebar-container {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 780px;
            height: 310px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
            transition: transform 0.1s ease-out;
        }
        .shake {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body tabindex="0" class="relative w-full h-screen overflow-hidden">

    <script>
        let scene, camera, renderer;
        let ambientLight, dirLight, bikeHeadlight, bikeGlowLight;
        let roadMesh, sideLeftMesh, sideRightMesh;
        let roadMaterial, sideMaterial, cloudMaterial, streetLightBulbMat;
        let cachedConstructionTexture = null;

        let roadLines = [];
        let mountains = [];
        let clouds = [];
        let streetLights = [];
        let guardRails = [];
        let starField, starMaterial;

        let playerX = 2.0;
        let targetPlayerX = 2.0;
        let playerTilt = 0;

        // Jump Physics
        let playerJumpY = 0;
        let jumpVelocity = 0;
        let isJumping = false;

        let baseSpeed = 1.0;
        let speed = 1.0;

        // Booster System
        let boostEnergy = 100;
        const BOOST_MAX_DURATION = 3.0;
        const BOOST_COOLDOWN_TIME = 5.0;
        let isBoosting = false;
        let boostCooldown = false;

        let distanceMeters = 0;
        let isGameOver = false;
        let isGameStarted = false;

        const ROAD_WIDTH = 26;
        const LANES = [-10.0, -6.0, -2.0, 2.0, 6.0, 10.0];

        const enemies = [];
        const constructionZones = [];
        const jumpRamps = [];

        let enemySpawnTimer = 0;
        let constructionSpawnTimer = 0;
        let rampSpawnTimer = 0;

        // Bike Color Presets
        const BIKE_COLORS = [
            { id: 'red', name: 'DUCATI RED', main: '#d6001c', stop0: '#ff3344', stop45: '#d6001c', stop85: '#8a0010', stop100: '#400007', border: '#ff4455' },
            { id: 'blue', name: 'CYBER BLUE', main: '#0072ff', stop0: '#00d2ff', stop45: '#0072ff', stop85: '#0033aa', stop100: '#001144', border: '#33e0ff' },
            { id: 'green', name: 'KAWASAKI GREEN', main: '#11998e', stop0: '#a8ff00', stop45: '#38ef7d', stop85: '#11998e', stop100: '#05443d', border: '#72ff53' },
            { id: 'yellow', name: 'RACING YELLOW', main: '#ffaa00', stop0: '#ffee00', stop45: '#ffaa00', stop85: '#cc7700', stop100: '#552200', border: '#fff155' },
            { id: 'purple', name: 'NEON PURPLE', main: '#aa00ff', stop0: '#e040fb', stop45: '#aa00ff', stop85: '#6200ea', stop100: '#2a0066', border: '#f077ff' },
            { id: 'black', name: 'STEALTH BLACK', main: '#333340', stop0: '#555566', stop45: '#333340', stop85: '#1e1e24', stop100: '#0a0a0d', border: '#777788' }
        ];
        let currentBikeColor = BIKE_COLORS[0];

        // Shared Geometry & Materials
        let sedanBodyGeo, sedanCabinGeo, wheelTireGeo, wheelRimGeo;
        let sedanMat, cabinMat, tireMat, rimMat, headlightMat, taillightMat;

        // UI elements
        const handlebarContainer = document.getElementById('handlebar-container');
        const jumpBadgeEl = document.getElementById('jump-badge');
        const timeTextEl = document.getElementById('time-text');
        const timeIconEl = document.getElementById('time-icon');
        const distanceEl = document.getElementById('distance-val');
        const speedEl = document.getElementById('speed-val');
        const boosterStatusEl = document.getElementById('booster-status');
        const boostGaugeBarEl = document.getElementById('boost-gauge-bar');
        const constructionBadgeEl = document.getElementById('construction-badge');
        const dashModeEl = document.getElementById('dash-mode');
        const dashGearEl = document.getElementById('dash-gear');
        const rpmBarEl = document.getElementById('rpm-bar');
        const overlayScreen = document.getElementById('overlay-screen');
        const titleText = document.getElementById('title-text');
        const subText = document.getElementById('sub-text');
        const startBtn = document.getElementById('start-btn');
        const scoreBox = document.getElementById('score-box');
        const finalDistanceEl = document.getElementById('final-distance');
        const soundBtn = document.getElementById('sound-btn');
        const soundIcon = document.getElementById('sound-icon');
        const colorPickerContainer = document.getElementById('color-picker-container');
        const selectedColorNameEl = document.getElementById('selected-color-name');

        const keys = { left: false, right: false, boost: false };

        let audioCtx = null;
        let isMuted = false;
        let engineOsc = null, engineGain = null;

        const COLOR_KEYFRAMES = {
            DAY: {
                bg: new THREE.Color(0x6bb5ff),
                fog: new THREE.Color(0x88c2ff),
                ambient: new THREE.Color(0xffffff),
                ambInt: 0.9,
                dirColor: new THREE.Color(0xfff5ea),
                dirInt: 1.0,
                grass: new THREE.Color(0x5a9e32),
                road: new THREE.Color(0x3a3a40),
                cloud: new THREE.Color(0xffffff),
                roughness: 0.8,
                starOpacity: 0.0,
                lightGlow: new THREE.Color(0x222222),
                headlightInt: 0.5,
                headlightDist: 100
            },
            SUNSET: {
                bg: new THREE.Color(0xd9572b),
                fog: new THREE.Color(0xe07238),
                ambient: new THREE.Color(0xffaa66),
                ambInt: 0.65,
                dirColor: new THREE.Color(0xff7700),
                dirInt: 1.2,
                grass: new THREE.Color(0x3b421a),
                road: new THREE.Color(0x2b2528),
                cloud: new THREE.Color(0xffb88c),
                roughness: 0.7,
                starOpacity: 0.2,
                lightGlow: new THREE.Color(0xffaa33),
                headlightInt: 4.5,
                headlightDist: 180
            },
            NIGHT: {
                bg: new THREE.Color(0x050510),
                fog: new THREE.Color(0x0a0a1a),
                ambient: new THREE.Color(0x334466),
                ambInt: 0.35,
                dirColor: new THREE.Color(0x6688cc),
                dirInt: 0.4,
                grass: new THREE.Color(0x081208),
                road: new THREE.Color(0x181820),
                cloud: new THREE.Color(0x222238),
                roughness: 0.2,
                starOpacity: 1.0,
                lightGlow: new THREE.Color(0xffdd66),
                headlightInt: 12.0,
                headlightDist: 250
            }
        };

        let currentPhase = 'DAY';
        let targetPhase = 'DAY';

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
                engineGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, audioCtx.currentTime);
                
                engineOsc.connect(filter);
                filter.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            } catch(e) {
                console.log("Audio Init Warning:", e);
            }
        }

        function updateEngineAudio(speedVal, boosting) {
            if (!audioCtx || isMuted) return;
            const targetFreq = 50 + (speedVal * 2.5) + (boosting ? 80 : 0);
            engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
        }

        function playSoundEffect(type) {
            if (!audioCtx || isMuted) return;
            
            if (type === 'boost') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'jump') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'crash') {
                const bufferSize = audioCtx.sampleRate * 0.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                noise.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            }
        }

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isMuted = !isMuted;
            soundIcon.textContent = isMuted ? '🔇' : '🔊';
            if (engineGain) {
                engineGain.gain.setValueAtTime(isMuted ? 0 : 0.05, audioCtx.currentTime);
            }
        });

        function getConstructionSignTexture() {
            if (cachedConstructionTexture) return cachedConstructionTexture;

            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 384);
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, 246, 374);

            ctx.fillStyle = '#111111';
            ctx.font = '900 38px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('공사중', 128, 55);

            ctx.beginPath();
            ctx.moveTo(128, 80);
            ctx.lineTo(225, 220);
            ctx.lineTo(31, 220);
            ctx.closePath();
            ctx.fillStyle = '#dc2626';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(128, 108);
            ctx.lineTo(205, 208);
            ctx.lineTo(51, 208);
            ctx.closePath();
            ctx.fillStyle = '#f59e0b';
            ctx.fill();

            ctx.fillStyle = '#111111';
            ctx.font = 'bold 44px sans-serif';
            ctx.fillText('🚧', 128, 185);

            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('전방 차선통제', 128, 275);
            ctx.font = 'bold 24px sans-serif';
            ctx.fillStyle = '#dc2626';
            ctx.fillText('서행 하시오', 128, 325);

        function init() {
            scene = new THREE.Scene();
            scene.background = COLOR_KEYFRAMES.DAY.bg.clone();
            scene.fog = new THREE.FogExp2(COLOR_KEYFRAMES.DAY.fog.getHex(), 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 700);
            camera.position.set(playerX, 1.25, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const container = document.getElementById('game-container');
            container.appendChild(renderer.domElement);

            ambientLight = new THREE.AmbientLight(COLOR_KEYFRAMES.DAY.ambient, COLOR_KEYFRAMES.DAY.ambInt);
            scene.add(ambientLight);

            dirLight = new THREE.DirectionalLight(COLOR_KEYFRAMES.DAY.dirColor, COLOR_KEYFRAMES.DAY.dirInt);
            dirLight.position.set(40, 80, -40);
            scene.add(dirLight);

            bikeHeadlight = new THREE.SpotLight(0xfffae6, 8.0, 200, Math.PI / 4, 0.25, 1);
            bikeHeadlight.position.set(playerX, 1.2, -0.5);
            bikeHeadlight.target.position.set(playerX, 0.0, -80);
            scene.add(bikeHeadlight);
            scene.add(bikeHeadlight.target);

            bikeGlowLight = new THREE.PointLight(0xfffae6, 2.0, 15);
            bikeGlowLight.position.set(playerX, 1.0, -2);
            scene.add(bikeGlowLight);

            initSharedGeometries();
            createRoadAndLandscape();
            createStreetLights();
            createGuardRails();
            createStars();
            createClouds();

            const handleStartTrigger = (e) => {
                if (e && e.stopPropagation) e.stopPropagation();
                initAudio();
                if (!isGameStarted || isGameOver) {
                    startGame();
                }
            };

            startBtn.addEventListener('click', handleStartTrigger);
            overlayScreen.addEventListener('click', handleStartTrigger);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));

            const touchLeft = document.getElementById('touch-left');
            const touchRight = document.getElementById('touch-right');
            const touchBoost = document.getElementById('touch-boost');

            touchLeft.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); keys.left = true; if(!isGameStarted) startGame(); });
            touchLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
            touchRight.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); keys.right = true; if(!isGameStarted) startGame(); });
            touchRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

            touchBoost.addEventListener('touchstart', (e) => { e.preventDefault(); keys.boost = true; });
            touchBoost.addEventListener('touchend', (e) => { e.preventDefault(); keys.boost = false; });

            animate();
        }

        function spawnEnemy(customZ = -220) {
            const enemy = createVehicleMesh();
            const laneIndex = Math.floor(Math.random() * LANES.length);
            const spawnX = LANES[laneIndex];
            const spawnZ = customZ;

            const exists = enemies.some(e => Math.abs(e.position.z - spawnZ) < 25 && Math.abs(e.position.x - spawnX) < 1.0);
            if (exists) return;

            const hitsConstruction = constructionZones.some(c => Math.abs(c.position.z - spawnZ) < 35 && Math.abs(c.position.x - spawnX) < 2.0);
            if (hitsConstruction) return;

            const hitsRamp = jumpRamps.some(r => Math.abs(r.position.z - spawnZ) < 15 && Math.abs(r.position.x - spawnX) < 2.0);
            if (hitsRamp) return;

            const isOncoming = spawnX < 0;
            enemy.rotation.y = isOncoming ? 0 : Math.PI;
            enemy.position.set(spawnX, 0, spawnZ);

            const randType = Math.random();
            let behavior = 'straight';
            let targetX = spawnX;

            if (randType < 0.45) {
                behavior = 'straight';
            } else if (randType < 0.80) {
                behavior = 'lane_change';
                const shift = Math.random() < 0.5 ? -1 : 1;
                const targetLaneIdx = Math.max(0, Math.min(LANES.length - 1, laneIndex + shift));
                targetX = LANES[targetLaneIdx];
            } else {
                behavior = 'zigzag';
            }

            enemy.userData.isOncoming = isOncoming;
            enemy.userData.behavior = behavior;
            enemy.userData.originX = spawnX;
            enemy.userData.targetX = targetX;
            enemy.userData.swayPhase = Math.random() * Math.PI * 2;
            enemy.userData.swaySpeed = 1.2 + Math.random() * 1.5;
            enemy.userData.speedMult = 0.8 + Math.random() * 0.5;

            scene.add(enemy);
            enemies.push(enemy);
        }

        function spawnJumpRamp() {
            const validLanes = LANES.filter(laneX => {
                const hasConstruction = constructionZones.some(c => Math.abs(c.position.z - (-220)) < 40 && Math.abs(c.position.x - laneX) < 2.0);
                const hasEnemy = enemies.some(e => Math.abs(e.position.z - (-220)) < 25 && Math.abs(e.position.x - laneX) < 2.0);
                return !hasConstruction && !hasEnemy;
            });
            if (validLanes.length === 0) return;

            const ramp = createJumpRampMesh();
            const chosenX = validLanes[Math.floor(Math.random() * validLanes.length)];
            ramp.position.set(chosenX, 0, -220);
            scene.add(ramp);
            jumpRamps.push(ramp);
        }

        function spawnConstructionZone() {
            const validLanes = LANES.filter(laneX => {
                const hasRamp = jumpRamps.some(r => Math.abs(r.position.z - (-260)) < 50 && Math.abs(r.position.x - laneX) < 2.0);
                return !hasRamp;
            });
            if (validLanes.length === 0) return;

            const chosenX = validLanes[Math.floor(Math.random() * validLanes.length)];
            const zone = createExtendedConstructionZoneMesh(chosenX);
            zone.position.z = -260;

            for (let i = enemies.length - 1; i >= 0; i--) {
                if (Math.abs(enemies[i].position.x - chosenX) < 2.0 && Math.abs(enemies[i].position.z - (-260)) < 40) {
                    scene.remove(enemies[i]);
                    enemies.splice(i, 1);
                }
            }

            scene.add(zone);
            constructionZones.push(zone);
        }

        function applyBikeColor(colorObj) {
            currentBikeColor = colorObj;
            
            const stop0 = document.querySelector('#ducatiRed stop[offset="0%"]');
            const stop45 = document.querySelector('#ducatiRed stop[offset="45%"]');
            const stop85 = document.querySelector('#ducatiRed stop[offset="85%"]');
            const stop100 = document.querySelector('#ducatiRed stop[offset="100%"]');

            if (stop0) stop0.setAttribute('stop-color', colorObj.stop0);
            if (stop45) stop45.setAttribute('stop-color', colorObj.stop45);
            if (stop85) stop85.setAttribute('stop-color', colorObj.stop85);
            if (stop100) stop100.setAttribute('stop-color', colorObj.stop100);

            const cowls = document.querySelectorAll('path[fill="url(#ducatiRed)"]');
            cowls.forEach(cowl => cowl.setAttribute('stroke', colorObj.border));

            const handles = document.querySelectorAll('path[stroke="#d6001c"]');
            handles.forEach(h => h.setAttribute('stroke', colorObj.main));

            const mirrors = document.querySelectorAll('path[stroke="#d6001c"]');
            mirrors.forEach(m => m.setAttribute('stroke', colorObj.main));

            const tftFrame = document.querySelector('rect[fill="url(#tftScreen)"]');
            if (tftFrame) tftFrame.setAttribute('stroke', colorObj.main);

            const windshieldGlow = document.querySelector('path[stroke^="rgba(255, 34, 51"]');
            if (windshieldGlow) windshieldGlow.setAttribute('stroke', colorObj.main);

            }

        function handleKey(e, isDown) {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = isDown;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = isDown;
            if (e.key === 'Shift') keys.boost = isDown;

            if (isDown && (!isGameStarted || isGameOver)) {
                initAudio();
                startGame();
            }
        }

        function startGame() {
            isGameStarted = true;
            isGameOver = false;
            distanceMeters = 0;
            speed = 1.0;
            playerX = 2.0;
            targetPlayerX = 2.0;
            playerJumpY = 0;
            jumpVelocity = 0;
            isJumping = false;
            boostEnergy = 100;
            isBoosting = false;
            boostCooldown = false;

            [...enemies, ...constructionZones, ...jumpRamps].forEach(obj => scene.remove(obj));
            enemies.length = 0;
            constructionZones.length = 0;
            jumpRamps.length = 0;

            spawnEnemy(-70);
            spawnEnemy(-120);
            spawnEnemy(-170);

            overlayScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => overlayScreen.classList.add('hidden'), 300);
        }

        function gameOver() {
            isGameOver = true;
            isGameStarted = false;
            playSoundEffect('crash');
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 400);

            titleText.textContent = "CRASHED!";
            subText.innerHTML = "차량 또는 장애물과 충돌했습니다.<br>다시 도전해보세요!";
            startBtn.textContent = "다시 시작하기";
            finalDistanceEl.textContent = Math.floor(distanceMeters);
            scoreBox.classList.remove('hidden');

            overlayScreen.classList.remove('hidden');
            setTimeout(() => overlayScreen.classList.remove('opacity-0', 'pointer-events-none'), 10);
        }

        function updateEnvironment(delta) {
            if (distanceMeters < 800) targetPhase = 'DAY';
            else if (distanceMeters < 1800) targetPhase = 'SUNSET';
            else targetPhase = 'NIGHT';

            const p = COLOR_KEYFRAMES[targetPhase];

            scene.background.lerp(p.bg, delta * 0.5);
            scene.fog.color.lerp(p.fog, delta * 0.5);
            ambientLight.color.lerp(p.ambient, delta * 0.5);
            ambientLight.intensity = THREE.MathUtils.lerp(ambientLight.intensity, p.ambInt, delta * 0.5);

            dirLight.color.lerp(p.dirColor, delta * 0.5);
            dirLight.intensity = THREE.MathUtils.lerp(dirLight.intensity, p.dirInt, delta * 0.5);

            roadMaterial.color.lerp(p.road, delta * 0.5);
            sideMaterial.color.lerp(p.grass, delta * 0.5);
            cloudMaterial.color.lerp(p.cloud, delta * 0.5);
            starMaterial.opacity = THREE.MathUtils.lerp(starMaterial.opacity, p.starOpacity, delta * 0.5);

            streetLightBulbMat.color.lerp(p.lightGlow, delta * 0.5);
            bikeHeadlight.intensity = THREE.MathUtils.lerp(bikeHeadlight.intensity, p.headlightInt, delta * 0.5);

            if (targetPhase === 'DAY') {
                timeIconEl.textContent = '☀️';
                timeTextEl.textContent = '낮 (Day)';
                timeTextEl.className = 'text-xs font-bold text-cyan-300';
            } else if (targetPhase === 'SUNSET') {
                timeIconEl.textContent = '🌅';
                timeTextEl.textContent = '노을 (Sunset)';
                timeTextEl.className = 'text-xs font-bold text-amber-300';
            } else {
                timeIconEl.textContent = '🌙';
                timeTextEl.textContent = '맑은 밤 (Night)';
                timeTextEl.className = 'text-xs font-bold text-indigo-300';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (isGameStarted && !isGameOver) {
                const maxRoadBoundary = ROAD_WIDTH / 2 - 1.5;
                const moveSpeed = 16.0 * delta;

                if (keys.left) targetPlayerX = Math.max(-maxRoadBoundary, targetPlayerX - moveSpeed);
                if (keys.right) targetPlayerX = Math.min(maxRoadBoundary, targetPlayerX + moveSpeed);

                targetPlayerX = Math.max(-maxRoadBoundary, Math.min(maxRoadBoundary, targetPlayerX));
                playerX += (targetPlayerX - playerX) * 0.15;
                playerX = Math.max(-maxRoadBoundary, Math.min(maxRoadBoundary, playerX));

                const tiltTarget = (targetPlayerX - playerX) * -0.25;
                playerTilt += (tiltTarget - playerTilt) * 0.1;

                if (keys.boost && boostEnergy > 0 && !boostCooldown) {
                    if (!isBoosting) playSoundEffect('boost');
                    isBoosting = true;
                    boostEnergy = Math.max(0, boostEnergy - (100 / BOOST_MAX_DURATION) * delta);
                    if (boostEnergy === 0) {
                        boostCooldown = true;
                        isBoosting = false;
                    }
                } else {
                    isBoosting = false;
                    if (boostCooldown) {
                        boostEnergy = Math.min(100, boostEnergy + (100 / BOOST_COOLDOWN_TIME) * delta);
                        if (boostEnergy === 100) boostCooldown = false;
                    } else {
                        boostEnergy = Math.min(100, boostEnergy + 15 * delta);
                    }
                }

                speed = baseSpeed * (isBoosting ? 1.85 : 1.0);
                const currentKmH = Math.floor(speed * 60 + (isBoosting ? 50 : 0));
                distanceMeters += speed * 30 * delta;

                if (isJumping) {
                    playerJumpY += jumpVelocity;
                    jumpVelocity -= 0.025;
                    if (playerJumpY <= 0) {
                        playerJumpY = 0;
                        jumpVelocity = 0;
                        isJumping = false;
                    }
                }

                camera.position.x = playerX;
                camera.position.y = 1.25 + playerJumpY;
                camera.rotation.z = playerTilt * 0.5;

                bikeHeadlight.position.x = playerX;
                bikeHeadlight.target.position.x = playerX;
                bikeHeadlight.position.y = 1.2 + playerJumpY;
                bikeGlowLight.position.x = playerX;

                handlebarContainer.style.transform = `translateX(-50%) rotate(${playerTilt * 8}deg) translateY(${isBoosting ? 8 : 0}px)`;

                distanceEl.textContent = Math.floor(distanceMeters);
                speedEl.textContent = currentKmH;
                boostGaugeBarEl.style.width = `${boostEnergy}%`;

                if (boostCooldown) {
                    boosterStatusEl.textContent = "RECHARGING";
                    boosterStatusEl.className = "text-[9px] sm:text-[10px] font-black text-red-400 animate-pulse";
                    boostGaugeBarEl.className = "bg-red-500 h-full w-full transition-all duration-75";
                } else if (isBoosting) {
                    boosterStatusEl.textContent = "BOOSTING!";
                    boosterStatusEl.className = "text-[9px] sm:text-[10px] font-black text-yellow-300 animate-bounce";
                    boostGaugeBarEl.className = "bg-amber-300 h-full w-full transition-all duration-75";
                } else {
                    boosterStatusEl.textContent = "READY (SHIFT)";
                    boosterStatusEl.className = "text-[9px] sm:text-[10px] font-black text-cyan-400";
                    boostGaugeBarEl.className = "bg-yellow-400 h-full w-full transition-all duration-75";
                }

                dashModeEl.textContent = isBoosting ? "BOOST" : "RACE";
                dashModeEl.setAttribute('fill', isBoosting ? "#ffcc00" : "#00f3ff");
                dashGearEl.textContent = `GEAR ${Math.min(6, Math.floor(currentKmH / 20) + 1)} • ${currentBikeColor.name}`;

                const rpmRatio = Math.min(1.0, currentKmH / 180);
                const dashOffset = 140 - (rpmRatio * 140);
                rpmBarEl.style.strokeDashoffset = dashOffset;

                jumpBadgeEl.classList.toggle('hidden', !isJumping);

                updateEngineAudio(currentKmH, isBoosting);

                const zMove = speed * 100 * delta;

                roadLines.forEach(line => {
                    line.position.z += zMove;
                    if (line.position.z > 10) line.position.z -= 900;
                });

                streetLights.forEach(pole => {
                    pole.position.z += zMove;
                    if (pole.position.z > 20) pole.position.z -= 800;
                });

                clouds.forEach(cloud => {
                    cloud.position.z += zMove * 0.2;
                    cloud.position.x += cloud.userData.driftSpeed;
                    if (cloud.position.z > 50) cloud.position.z -= 550;
                });

                enemySpawnTimer += delta;
                const spawnInterval = Math.max(0.35, 0.85 - (distanceMeters / 2500));
                if (enemySpawnTimer > spawnInterval) {
                    spawnEnemy();
                    if (Math.random() < 0.65) {
                        spawnEnemy();
                    }
                    enemySpawnTimer = 0;
                }

                rampSpawnTimer += delta;
                if (rampSpawnTimer > 7.0) {
                    spawnJumpRamp();
                    rampSpawnTimer = 0;
                }

                constructionSpawnTimer += delta;
                if (constructionSpawnTimer > 15.0) {
                    spawnConstructionZone();
                    constructionSpawnTimer = 0;
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    const baseFactor = (e.userData.isOncoming ? 1.4 : 0.6) * (e.userData.speedMult || 1.0);
                    e.position.z += zMove * baseFactor;

                    if (e.userData.behavior === 'lane_change') {
                        e.position.x += (e.userData.targetX - e.position.x) * 1.5 * delta;
                        const laneOffset = e.userData.targetX - e.position.x;
                        const baseRot = e.userData.isOncoming ? 0 : Math.PI;
                        e.rotation.y = baseRot + laneOffset * 0.05;
                    } else if (e.userData.behavior === 'zigzag') {
                        e.userData.swayPhase += e.userData.swaySpeed * delta;
                        const swayOffset = Math.sin(e.userData.swayPhase) * 1.8;
                        const targetX = Math.max(-maxRoadBoundary + 0.5, Math.min(maxRoadBoundary - 0.5, e.userData.originX + swayOffset));
                        e.position.x += (targetX - e.position.x) * 3.0 * delta;
                        const baseRot = e.userData.isOncoming ? 0 : Math.PI;
                        e.rotation.y = baseRot + Math.cos(e.userData.swayPhase) * 0.08;
                    }

                    let removed = false;

                    for (let c of constructionZones) {
                        if (Math.abs(c.position.x - e.position.x) < 2.0 && Math.abs(c.position.z - e.position.z) < 14.0) {
                            scene.remove(e);
                            enemies.splice(i, 1);
                            removed = true;
                            break;
                        }
                    }
                    if (removed) continue;

                    for (let r of jumpRamps) {
                        if (Math.abs(r.position.x - e.position.x) < 2.0 && Math.abs(r.position.z - e.position.z) < 4.0) {
                            scene.remove(e);
                            enemies.splice(i, 1);
                            removed = true;
                            break;
                        }
                    }
                    if (removed) continue;

                    if (Math.abs(e.position.z) < 2.5 && Math.abs(e.position.x - playerX) < (e.userData.width / 2 + 0.4)) {
                        if (playerJumpY < e.userData.height) {
                            gameOver();
                            return;
                        }
                    }

                    if (e.position.z > 30) {
                        scene.remove(e);
                        enemies.splice(i, 1);
                    }
                }

                for (let i = jumpRamps.length - 1; i >= 0; i--) {
                    const r = jumpRamps[i];
                    r.position.z += zMove;

                    if (Math.abs(r.position.z) < 3.0 && Math.abs(r.position.x - playerX) < 2.0 && !isJumping) {
                        isJumping = true;
                        jumpVelocity = 0.5;
                        playSoundEffect('jump');
                    }

                    if (r.position.z > 30) {
                        scene.remove(r);
                        jumpRamps.splice(i, 1);
                    }
                }

                let constructionNear = false;
                for (let i = constructionZones.length - 1; i >= 0; i--) {
                    const c = constructionZones[i];
                    c.position.z += zMove;

                    c.userData.lights.forEach(l => {
                        l.material.color.setHex(Math.floor(now / 200) % 2 === 0 ? 0xffaa00 : 0x332200);
                    });

                    if (c.position.z < 20 && c.position.z > -180) constructionNear = true;

                    if (Math.abs(c.position.z) < 13.0 && Math.abs(c.position.x - playerX) < 1.8) {
                        if (playerJumpY < c.userData.height) {
                            gameOver();
                            return;
                        }
                    }

                    if (c.position.z > 50) {
                        scene.remove(c);
                        constructionZones.splice(i, 1);
                    }
                }
                constructionBadgeEl.classList.toggle('hidden', !constructionNear);

                updateEnvironment(delta);
            }

            renderer.render(scene, camera);
        }

        window.onload = function() {
            init();
            initBikeColorPickerUI();
        };
    </script>
</body>
</html>
